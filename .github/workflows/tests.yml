name: Regression tests

on:
  push:
    branches:
      - main
      - mp2-presentation
  pull_request:
    branches:
      - main
      - mp2-presentation
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system video dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless scipy scikit-image scikit-learn pandas pyyaml joblib pytest

      - name: Run regression tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q
